<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PhysicRP</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

body {
    background-image:
        linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)),
        url("preview.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* Затемнение */
.overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        90deg,
        rgba(0,0,0,0.35),
        transparent 50%,
        rgba(0,0,0,0.25)
    );
}

/* Логотип */
.logo {
    position: absolute;
    top: 45px;
    left: 55px;

    font-size: 52px;
    font-weight: bold;

    background: linear-gradient(
        90deg,
        #00eaff,
        #b45cff,
        #ff4fc3,
        #ffd45c
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    text-shadow:
        0 0 15px rgba(0,220,255,0.5),
        0 0 30px rgba(255,70,220,0.35);
}

/* Текст */
.welcome {
    position: absolute;
    left: 60px;
    bottom: 125px;

    color: white;
    font-size: 25px;
    font-weight: bold;

    text-shadow: 0 2px 10px black;
}

.status {
    margin-top: 8px;

    color: rgba(255,255,255,0.7);
    font-size: 15px;
}

/* Полоса загрузки */
.loading {
    position: absolute;
    left: 60px;
    bottom: 85px;

    width: 450px;
    height: 6px;

    background: rgba(255,255,255,0.2);
    border-radius: 10px;

    overflow: hidden;
}

.progress {
    width: 0%;
    height: 100%;

    border-radius: 10px;

    background: linear-gradient(
        90deg,
        #00eaff,
        #9b5cff,
        #ff4fc3
    );

    box-shadow:
        0 0 15px #00eaff;

    transition: width 0.2s;
}

/* Проценты */
.percent {
    position: absolute;
    left: 520px;
    bottom: 80px;

    color: white;
    font-size: 15px;
    font-weight: bold;
}

/* Нижний текст */
.footer {
    position: absolute;
    bottom: 30px;
    left: 60px;

    color: rgba(255,255,255,0.5);
    font-size: 12px;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="logo">
    PhysicRP
</div>

<div class="welcome">
    Добро пожаловать на PhysicRP

    <div class="status" id="status">
        Подключение к серверу...
    </div>
</div>

<div class="loading">
    <div class="progress" id="progress"></div>
</div>

<div class="percent" id="percent">
    0%
</div>

<div class="footer">
    DarkRP • RolePlay
</div>

<script>

let totalFiles = 0;
let neededFiles = 0;

/* Информация о сервере */
function GameDetails(
    servername,
    serverurl,
    mapname,
    maxplayers,
    steamid,
    gamemode
) {
    document.getElementById("status").innerText =
        "Подключение к " + (servername || "PhysicRP") + "...";
}

/* Всего файлов */
function SetFilesTotal(total) {
    totalFiles = total;
    updateProgress();
}

/* Осталось файлов */
function SetFilesNeeded(needed) {
    neededFiles = needed;
    updateProgress();
}

/* Загрузка конкретного файла */
function DownloadingFile(fileName) {
    document.getElementById("status").innerText =
        "Загрузка: " + fileName;

    updateProgress();
}

/* Статус */
function SetStatusChanged(status) {
    document.getElementById("status").innerText =
        status;
}

/* Прогресс */
function updateProgress() {

    if (totalFiles <= 0)
        return;

    let progress =
        ((totalFiles - neededFiles) / totalFiles) * 100;

    progress = Math.max(0, Math.min(100, progress));

    document.getElementById("progress").style.width =
        progress + "%";

    document.getElementById("percent").innerText =
        Math.round(progress) + "%";
}

</script>

</body>
</html>
