<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysicRP Loading</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
        }
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Растягивает картинку с сохранением пропорций на весь экран */
            z-index: -1;
        }
    </style>
</head>
<body>

    <img class="bg-image" src="https://raw.githubusercontent.com/yarovv90-bit/physicload/main/preview.jpg" alt="Loading Background">

</body>
</html>
