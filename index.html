<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PhysicRP Loading</title>
    <style>
        /* Сбрасываем отступы у всей страницы */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
        }

        /* Принудительно растягиваем картинку на 100% ширины и высоты экрана */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Растягивает картинку, заполняя весь экран (края могут чуть обрезаться, если пропорции не совпадают) */
            object-fit: fill; 
        }
    </style>
</head>
<body>

    <img class="bg-image" src="https://raw.githubusercontent.com/yarovv90-bit/physicload/main/preview.jpg" alt="Loading">

</body>
</html>
